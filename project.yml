name: StepOff
options:
  bundleIdPrefix: com.ribhavhora
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Set your Apple ID team here (Xcode > Settings > Accounts) to run on a device:
    # DEVELOPMENT_TEAM: ABCDE12345

targets:
  StepOff:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StepOff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ribhavhora.stepoff
        INFOPLIST_FILE: StepOff/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

  StepOffTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StepOffTests
    dependencies:
      - target: StepOff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ribhavhora.stepoff.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  StepOff:
    build:
      targets:
        StepOff: all
        StepOffTests: [test]
    test:
      targets:
        - StepOffTests
